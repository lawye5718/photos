services:
  gallery:
    build:
      context: .
      # 群晖 docker0 桥接出口极慢，构建期用 host 网络直连镜像源
      network: host
    image: gallery-studio:local
    container_name: gallery
    restart: unless-stopped

    # 宿主 8890（已核验空闲；与现有 8888/8730/8731/8787/20128 等均不冲突）
    ports:
      - "8890:8890"

    environment:
      TZ: Asia/Shanghai
      GALLERY_PORT: "8890"
      GALLERY_DATA: /app/data
      # 零挂载：媒体走 Lsky PHP 路由（HTTP），账号校验/同步走 Lsky 的 Gallery HTTP 接口，
      # 不再挂载 Lsky 的任何目录或 sqlite 文件——彻底摆脱软链/权限/迁移地狱。
      # 内网直连 Lsky 宿主端口（不绕公网/Cloudflare）；失败自动回落公网域名
      LSKY_API_URL: http://192.168.0.107:8888
      LSKY_APP_URL: https://pic.damingxing.vip
      # 与 Lsky 容器环境变量 GALLERY_VERIFY_SECRET 必须一致
      LSKY_VERIFY_SECRET: "d1b9152a1c2eca51e77fba310a356f8e2919d91105514aa1"
      TOKEN_TTL: "604800"          # 长期口令签发的 token 有效期（7 天）
      # webhook 接收密钥（失败关闭）：调用方须在请求头 X-Gallery-Webhook-Key
      # 或 URL 参数 ?key= 携带相同值，否则 503/401 拒绝（修复「任何人可上传」）。
      LSKY_WEBHOOK_SECRET: "JozEBoB_gkFADA1t8TFPBshY3L0eVzBGL7cpJovNp68"

    volumes:
      - ./data:/app/data
      # 不再挂载 Lsky 的 storage / lsky.sqlite：账号校验经 /api/auth/verify、
      # 同步经 /api/gallery/images，媒体经 Lsky PHP 路由，全部走 HTTP

    healthcheck:
      # 用首页探测：/api/* 需要令牌，urllib 遇 401 会直接抛异常，不适合做健康检查
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8890/', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
