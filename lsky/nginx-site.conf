server {
    # 不使用 default_server：alpine 自带的 /etc/nginx/http.d/default.conf 已占用默认站，
    # 二者同时声明 default_server 会让 nginx 启动即报 duplicate default server
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/lsky/public;
    index index.php index.html;
    charset utf-8;

    # 图床允许较大的原图上传（与组配置 maximum_file_size=1G 对齐）
    client_max_body_size 1024m;
    client_body_timeout 600s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # 让静态资源由 nginx 直出，图片走高速的 sendfile
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|css|js|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
