services:
  lsky:
    build:
      context: .
      # 群晖 docker0 桥接出口极慢（apk 约 30s/包），构建期改用 host 网络直连
      network: host
    image: lsky-pro:local
    container_name: lsky-pro
    restart: unless-stopped

    # 宿主 8888 —— 已核验在群晖上空闲（现有占用：8730/8731/8787/20128 及 DSM 的 5000/5001/8000/8090 等）
    ports:
      - "8888:80"

    environment:
      TZ: Asia/Shanghai
      # Gallery（光影收藏）专用接口的共享密钥：调用方须在请求头带 X-Gallery-Verify-Key。
      # 未配置则 /api/auth/verify、/api/gallery/images 一律 403（失败关闭）。
      # 与 gallery 容器的 LSKY_VERIFY_SECRET 必须一致
      GALLERY_VERIFY_SECRET: "d1b9152a1c2eca51e77fba310a356f8e2919d91105514aa1"

    volumes:
      # 持久化：SQLite 库 + 上传的图片 + 日志 + 框架缓存（唯一需要备份的目录）
      - ./storage:/var/www/lsky/storage
      # 应用配置（含首次生成的 APP_KEY），放镜像外，容器重建不丢
      - ./.env:/var/www/lsky/.env

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
